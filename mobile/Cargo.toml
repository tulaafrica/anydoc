[package]
name = "anydoc-mobile"
version = "0.1.0"
edition = "2024"
description = "Tula's mobile FFI for anydoc: bytes in, DocumentIR JSON + asset blob out"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# default-features = false drops the `pdf` feature: this FFI refuses PDFs
# before conversion (platform viewers render them better), so linking
# pdf-inspector would be pure dead weight in every app binary.
anydoc = { path = "..", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
