buildscript {
  repositories {
    mavenCentral()
    google()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.5.0"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.tula.anydoc"
  compileSdkVersion rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : 35

  defaultConfig {
    minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : 24
    // Follow the app's ABI selection (a -PreactNativeArchitectures=arm64-v8a
    // dev build must not force an armv7 link against libraries that were
    // never built), intersected with the ABIs the Rust core ships for.
    // 32-bit x86 emulators (rare since 2021 images) get no native slice.
    ndk {
      def supported = ["arm64-v8a", "armeabi-v7a", "x86_64"]
      def requested = rootProject.hasProperty("reactNativeArchitectures")
        ? rootProject.property("reactNativeArchitectures").toString().split(",").toList()
        : supported
      def chosen = requested.intersect(supported)
      abiFilters(*(chosen.isEmpty() ? supported : chosen))
    }
    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  // The generated CMake consumes fbjni/ReactAndroid/NitroModules as prefab
  // packages; without this find_package() cannot see any of them.
  buildFeatures {
    prefab true
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libjsi.so",
      "**/libc++_shared.so",
    ]
  }
}

dependencies {
  implementation project(":react-native-nitro-modules")
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-android:+"
  //noinspection GradleDynamicVersion
  implementation "com.facebook.fbjni:fbjni:+"
}

// Nitrogen's generated Kotlin sources + the "boosted by nitro" banner.
apply from: '../nitrogen/generated/android/RNAnydoc+autolinking.gradle'

// ---- Prebuilt Rust core -------------------------------------------------
// The static libraries are too large for the npm tarball (~90MB per ABI),
// so they ship as a GitHub Release asset and are fetched on first build.
// Building from source instead (`yarn build:rust`, needs the Rust
// toolchain) drops the same files in libs/ and this task self-skips.
def anydocLibsVersion = "0.1.0"
def anydocLibsUrl = project.hasProperty("anydocLibsUrl")
  ? project.property("anydocLibsUrl").toString()
  : "https://github.com/tulaafrica/anydoc/releases/download/rn-v${anydocLibsVersion}/anydoc-android-libs-${anydocLibsVersion}.zip"

tasks.register("downloadAnydocPrebuilt") {
  def libsRoot = file("libs")
  def abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
  onlyIf { abis.any { !new File(libsRoot, "${it}/libanydoc_mobile.a").exists() } }
  doLast {
    def zip = new File(buildDir, "anydoc-android-libs.zip")
    zip.parentFile.mkdirs()
    logger.lifecycle("Downloading anydoc prebuilt libraries: ${anydocLibsUrl}")
    ant.get(src: anydocLibsUrl, dest: zip, verbose: false)
    // The zip's layout is libs/<abi>/libanydoc_mobile.a, rooted here.
    copy {
      from zipTree(zip)
      into projectDir
    }
    abis.each { abi ->
      def lib = new File(libsRoot, "${abi}/libanydoc_mobile.a")
      if (!lib.exists()) {
        throw new GradleException("anydoc prebuilt download missing ${abi} - re-run, or build from source with scripts/build-rust.sh")
      }
    }
  }
}
preBuild.dependsOn("downloadAnydocPrebuilt")
