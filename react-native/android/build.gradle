buildscript {
  repositories {
    mavenCentral()
    google()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.5.0"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.tula.anydoc"
  compileSdkVersion rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : 35

  defaultConfig {
    minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : 24
    // Follow the app's ABI selection (a -PreactNativeArchitectures=arm64-v8a
    // dev build must not force an armv7 link against libraries that were
    // never built), intersected with the ABIs the Rust core ships for.
    // x86 emulators fall back to the JS converter (see the README).
    ndk {
      def supported = ["arm64-v8a", "armeabi-v7a"]
      def requested = rootProject.hasProperty("reactNativeArchitectures")
        ? rootProject.property("reactNativeArchitectures").toString().split(",").toList()
        : supported
      def chosen = requested.intersect(supported)
      abiFilters(*(chosen.isEmpty() ? supported : chosen))
    }
    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  // The generated CMake consumes fbjni/ReactAndroid/NitroModules as prefab
  // packages; without this find_package() cannot see any of them.
  buildFeatures {
    prefab true
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libjsi.so",
      "**/libc++_shared.so",
    ]
  }
}

dependencies {
  implementation project(":react-native-nitro-modules")
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-android:+"
  //noinspection GradleDynamicVersion
  implementation "com.facebook.fbjni:fbjni:+"
}

// Nitrogen's generated Kotlin sources + the "boosted by nitro" banner.
apply from: '../nitrogen/generated/android/RNAnydoc+autolinking.gradle'
